    }
    test {
        java {
            setSrcDirs(['src/bootstrapTest/java', 'src/test/java'])
            include 'com/starboundmc/*.java'
            include 'com/starboundmc/warp/*.java'
            include 'com/starboundmc/world/*.java'
            include 'com/starboundmc/world/starmap/*.java'
            include 'com/starboundmc/client/Starmap*.java'
            include 'com/starboundmc/client/starmap/*.java'
            include 'com/starboundmc/client/ShipConsoleScreenHitTestTest.java'
            include 'com/starboundmc/client/*.java'
            include 'com/starboundmc/client/shipai/*.java'
            include 'com/starboundmc/client/space/*.java'
            include 'com/starboundmc/network/*.java'
            include 'com/starboundmc/story/*.java'
        }
        resources.setSrcDirs(['src/bootstrapTest/resources'])
        compileClasspath += main.compileClasspath
        runtimeClasspath += main.runtimeClasspath
    }
}

// Minecraft 1.21.1 and NeoForge 21.1 require Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            if (project.hasProperty('quickPlayWorld')) {
                programArguments.addAll '--quickPlaySingleplayer', project.property('quickPlayWorld').toString()
            }
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

repositories {
    maven {
        name = 'FirstDark'
        url = uri('https://maven.firstdark.dev/snapshots')
        content {
            includeGroup 'com.lowdragmc.ldlib2'
        }
    }
}

dependencies {
    implementation "com.lowdragmc.ldlib2:ldlib2-neoforge-${minecraft_version}:${ldlib2_version}:all"
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
            minecraft_version       : minecraft_version,
            minecraft_version_range : minecraft_version_range,
            neo_version             : neo_version,
            loader_version_range    : loader_version_range,
            ldlib2_version_range    : ldlib2_version_range,
            mod_id                  : mod_id,
            mod_name                : mod_name,
            mod_license             : mod_license,
            mod_version             : mod_version,
            mod_authors             : mod_authors,
            mod_description         : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = layout.projectDirectory.dir('repo')
        }
    }
}
