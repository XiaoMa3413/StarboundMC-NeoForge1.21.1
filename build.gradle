plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.144'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Stages 1-2 compile the migrated registry and basic object layers. Systems
// that depend on networking, data components or worldgen remain isolated.
sourceSets {
    main {
        java {
            setSrcDirs(['src/main/java'])
            include 'com/starboundmc/StarboundMC.java'
            include 'com/starboundmc/block/ModBlocks.java'
            include 'com/starboundmc/block/ModBlockEntities.java'
            include 'com/starboundmc/item/ModItems.java'
            include 'com/starboundmc/entity/ModEntities.java'
            include 'com/starboundmc/entity/SeatEntity.java'
            include 'com/starboundmc/block/CaptainChairBlock.java'
            include 'com/starboundmc/block/ShipEngineBlock.java'
            include 'com/starboundmc/block/Stage2Blocks.java'
            include 'com/starboundmc/menu/ShipConsoleMenu.java'
            include 'com/starboundmc/menu/ShipCrateMenu.java'
            include 'com/starboundmc/menu/TeleporterMenu.java'
            include 'com/starboundmc/client/Stage2ClientRegistrar.java'
            include 'com/starboundmc/client/Stage2MenuScreen.java'
            include 'com/starboundmc/client/SeatRenderer.java'
            include 'com/starboundmc/menu/ModMenus.java'
            include 'com/starboundmc/sound/ModSounds.java'
            include 'com/starboundmc/world/ModWorldgen.java'
        }
        resources {
            setSrcDirs(['src/main/resources', 'src/generated/resources'])
            exclude '**/*.bbmodel'
            exclude 'src/generated/**/.cache'
        }
    }
    test {
        java.setSrcDirs(['src/bootstrapTest/java'])
        resources.setSrcDirs(['src/bootstrapTest/resources'])
    }
}

// Minecraft 1.21.1 and NeoForge 21.1 require Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

repositories {
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
            minecraft_version       : minecraft_version,
            minecraft_version_range : minecraft_version_range,
            neo_version             : neo_version,
            loader_version_range    : loader_version_range,
            mod_id                  : mod_id,
            mod_name                : mod_name,
            mod_license             : mod_license,
            mod_version             : mod_version,
            mod_authors             : mod_authors,
            mod_description         : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = layout.projectDirectory.dir('repo')
        }
    }
}
