# Gradle runtime settings. CI and local commands may override these values.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true
# ModDevGradle's Minecraft artifact task is not reliably configuration-cache
# compatible when dependency resolution has to retry.
org.gradle.configuration-cache=false

# Parchment parameter names and documentation layered over Mojang mappings.
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Fixed migration baseline. Do not upgrade beyond Minecraft 1.21.1 without approval.
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.248
loader_version_range=[1,)
ldlib2_version=2.2.36.a
ldlib2_version_range=[2.2.36.a,)

# Stable mod identity retained from the Forge version.
mod_id=starboundmc
mod_name=StarboundMC
mod_license=All Rights Reserved
mod_version=0.1-alpha
mod_group_id=com.starboundmc
mod_authors=StarboundMC Team
mod_description=StarboundMC mod.
